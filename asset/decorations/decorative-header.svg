<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <defs>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E2A2B" stop-opacity="0.1" />
      <stop offset="15%" stop-color="#FEF8F0" />
      <stop offset="50%" stop-color="#FFFDF9" />
      <stop offset="85%" stop-color="#FEF8F0" />
      <stop offset="100%" stop-color="#9E2A2B" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E1C490" stop-opacity="0" />
      <stop offset="25%" stop-color="#E1C490" />
      <stop offset="50%" stop-color="#B8860B" />
      <stop offset="75%" stop-color="#E1C490" />
      <stop offset="100%" stop-color="#E1C490" stop-opacity="0" />
    </linearGradient>
    <filter id="ribbonShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4C2D1F" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Left Scroll Tail -->
  <path d="M 40,40 C 25,40 10,30 5,20 C 15,28 30,35 45,35 Z" fill="#E1C490" opacity="0.6" />
  <path d="M 40,40 C 25,40 10,50 5,60 C 15,52 30,45 45,45 Z" fill="#E1C490" opacity="0.6" />
  
  <!-- Right Scroll Tail -->
  <path d="M 320,40 C 335,40 350,30 355,20 C 345,28 330,35 315,35 Z" fill="#E1C490" opacity="0.6" />
  <path d="M 320,40 C 335,40 350,50 355,60 C 345,52 330,45 315,45 Z" fill="#E1C490" opacity="0.6" />

  <!-- Main Banner Body with Curved Shape -->
  <path d="M 35,40 Q 180,22 325,40 L 315,55 Q 180,38 45,55 Z" fill="url(#ribbonGrad)" filter="url(#ribbonShadow)" />
  <path d="M 30,40 Q 180,20 330,40 Q 180,24 30,40" fill="none" stroke="url(#goldLine)" stroke-width="2" />
  <path d="M 40,55 Q 180,36 320,55 Q 180,40 40,55" fill="none" stroke="url(#goldLine)" stroke-width="1.2" opacity="0.7" />

  <!-- Flourish Ornaments at Left and Right of Banner -->
  <g transform="translate(55, 40) scale(0.8)">
    <circle cx="0" cy="0" r="3" fill="#E1C490" />
    <path d="M -8,-5 Q 0,0 -8,5 Q -3,0 -8,-5" fill="#9E2A2B" />
  </g>
  <g transform="translate(305, 40) scale(0.8)">
    <circle cx="0" cy="0" r="3" fill="#E1C490" />
    <path d="M 8,-5 Q 0,0 8,5 Q 3,0 8,-5" fill="#9E2A2B" />
  </g>
</svg>
