<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="100%" height="100%">
  <defs>
    <radialGradient id="blossomPetal" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="50%" stop-color="#FF9BBB" />
      <stop offset="90%" stop-color="#E63973" />
      <stop offset="100%" stop-color="#AA0028" />
    </radialGradient>
    <radialGradient id="budGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFB6C1" />
      <stop offset="100%" stop-color="#C72C41" />
    </radialGradient>
  </defs>

  <!-- Wooden branch -->
  <path d="M 5,90 Q 35,65 65,55 T 115,25 Q 95,45 80,48 Q 50,55 20,85 Z" fill="#6A3B22" opacity="0.85" />
  <path d="M 65,55 Q 55,35 45,20 Q 48,22 55,33 Q 65,48 70,52 Z" fill="#582E19" opacity="0.8" />
  <path d="M 80,48 Q 95,65 105,75 Q 98,68 85,55 Z" fill="#582E19" opacity="0.75" />

  <!-- Main Flower (Center) -->
  <g transform="translate(68, 52)">
    <!-- 5 Petals -->
    <path d="M 0,0 C -12,-22 12,-22 0,0" fill="url(#blossomPetal)" />
    <path d="M 0,0 C 18,-14 26,8 0,0" fill="url(#blossomPetal)" />
    <path d="M 0,0 C 12,18 -8,22 0,0" fill="url(#blossomPetal)" />
    <path d="M 0,0 C -20,12 -24,-8 0,0" fill="url(#blossomPetal)" />
    <path d="M 0,0 C -22,-10 -12,-24 0,0" fill="url(#blossomPetal)" />
    <!-- Pistil center -->
    <circle cx="0" cy="0" r="3.5" fill="#FFF275" />
    <circle cx="0" cy="0" r="1.5" fill="#AA0028" />
    <!-- Stamens -->
    <line x1="0" y1="0" x2="-4" y2="-6" stroke="#D35400" stroke-width="0.8" />
    <circle cx="-4" cy="-6" r="0.8" fill="#F39C12" />
    <line x1="0" y1="0" x2="4" y2="-5" stroke="#D35400" stroke-width="0.8" />
    <circle cx="4" cy="-5" r="0.8" fill="#F39C12" />
    <line x1="0" y1="0" x2="6" y2="2" stroke="#D35400" stroke-width="0.8" />
    <circle cx="6" cy="2" r="0.8" fill="#F39C12" />
    <line x1="0" y1="0" x2="-2" y2="6" stroke="#D35400" stroke-width="0.8" />
    <circle cx="-2" cy="6" r="0.8" fill="#F39C12" />
    <line x1="0" y1="0" x2="-6" y2="-1" stroke="#D35400" stroke-width="0.8" />
    <circle cx="-6" cy="-1" r="0.8" fill="#F39C12" />
  </g>

  <!-- Secondary Flower (Top Right) -->
  <g transform="translate(102, 28) scale(0.72) rotate(25)">
    <path d="M 0,0 C -12,-20 12,-20 0,0" fill="url(#blossomPetal)" />
    <path d="M 0,0 C 18,-12 24,8 0,0" fill="url(#blossomPetal)" />
    <path d="M 0,0 C 12,18 -8,22 0,0" fill="url(#blossomPetal)" />
    <path d="M 0,0 C -18,12 -22,-8 0,0" fill="url(#blossomPetal)" />
    <path d="M 0,0 C -20,-10 -10,-22 0,0" fill="url(#blossomPetal)" />
    <circle cx="0" cy="0" r="3" fill="#FFF275" />
    <circle cx="0" cy="0" r="1.2" fill="#AA0028" />
  </g>

  <!-- Bud (Top Left) -->
  <g transform="translate(45, 20)">
    <path d="M 0,0 C -4,-8 4,-8 0,0" fill="url(#budGrad)" />
    <path d="M 0,0 C 2,-9 8,-4 0,0" fill="url(#budGrad)" opacity="0.9" />
    <path d="M -1,0 C -2,3 2,3 1,0 Z" fill="#6A3B22" />
  </g>

  <!-- Floating Falling Petals -->
  <g transform="translate(30, 45) rotate(45) scale(0.6)">
    <path d="M 0,0 C -8,-14 8,-14 0,0" fill="url(#blossomPetal)" opacity="0.85" />
  </g>
  <g transform="translate(90, 70) rotate(-20) scale(0.55)">
    <path d="M 0,0 C -8,-14 8,-14 0,0" fill="url(#blossomPetal)" opacity="0.8" />
  </g>
</svg>
